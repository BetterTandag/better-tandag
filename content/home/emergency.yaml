preparedness:
  - en: 'Know your evacuation centre — ask at the barangay hall, not on the day of the storm.'
    fil: 'Alamin ang inyong evacuation centre — magtanong sa barangay hall, hindi sa araw mismo ng bagyo.'
  - en: 'Photograph IDs, land titles and permits; keep them in a sealed bag.'
    fil: 'Kunan ng litrato ang mga ID, titulo ng lupa at permiso; itago sa selyadong supot.'
  - en: 'Three days of water, food, batteries and a charged power bank.'
    fil: 'Tatlong araw na tubig, pagkain, baterya at puno ang power bank.'
  - en: 'Agree a meeting point with family for when signal drops.'
    fil: 'Magkasundo ng tagpuan kasama ang pamilya kapag nawala ang signal.'
  - en: "Follow PAGASA bulletins and the city's own advisories over rumour."
    fil: 'Sundin ang mga bulletin ng PAGASA at ang abiso ng lungsod, hindi ang tsismis.'
