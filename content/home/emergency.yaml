# Emergency.
#
# The local numbers below are supplied by a resident contributor. They could NOT
# be traced to a public posting — tandag.gov.ph did not resolve when last
# checked — so they ship with their provenance stated plainly above the list
# rather than dressed up as official. That is the deal: publish, but say where
# it came from and when it was last looked at.
#
# `provenance.lastCheckedAt` is rendered on the page. Bump it whenever the
# numbers are re-checked; a stale date on an emergency number is its own hazard.
# If a number is ever confirmed against a City / PNP / BFP posting, add the URL
# to that hotline's `source.url` and it becomes a citation link.

provenance:
  lastCheckedAt: '2026-07-28'
  note:
    en: >-
      Supplied by a resident contributor and last checked on the date below.
      Save them to your phone now, not during the storm — and tell us at once if
      a number has changed.
    fil: >-
      Galing sa isang residenteng nag-ambag at huling tiningnan sa petsang nasa
      ibaba. I-save na ito sa inyong telepono ngayon, hindi sa gitna ng bagyo —
      at sabihan kaagad kami kung may numerong nagbago.

