# History — the three name-origin stories and the timeline.
#
# Every claim here is checked against the Wikipedia article on Tandag and the
# works it cites. Short fields carry Filipino; the long historical prose does
# not yet, and falls back to English behind a visible banner rather than
# shipping an unreviewed translation of a detailed historical claim.

etymology:
  - word: tamda
    gloss:
      en: '“look down”'
      fil: '“tumingin sa ibaba”'
    body:
      en: >-
        A priest on his way to baptise Suba's people pointed downward and asked
        what the place was called. The man rowing the boat thought he meant the
        fish below, and answered accordingly.

  - word: tangad
    gloss:
      en: 'from tanglad, lemongrass'
      fil: 'mula sa tanglad'
    body:
      en: >-
        An explorer landed to subdue the Caragas and asked a man gathering herbs
        where he was. The man spoke no Spanish, and named what was in his hands.

  - word: tarantados
    gloss:
      en: '“lost”'
      fil: '“naligaw”'
    body:
      en: >-
        Soldiers and missionaries who had lost their way asked for directions.
        The villagers only laughed and kept repeating the word for what they
        plainly were.

timeline:
  - period:
      en: 'Before the Spanish'
      fil: 'Bago ang mga Espanyol'
    title:
      en: 'Manobo and Mamanwa country'
      fil: 'Lupain ng mga Manobo at Mamanwa'
    body:
      en: >-
        Manobos and Mamanwas lived along the river banks under their chieftain,
        Suba — the name the city still carries in its oldest stories. Suba was
        later baptised by the Spanish missionary Father Juan de la Encarnacion,
        who was afterwards killed by the people of the coast.

  - period:
      en: 'After 1609'
      fil: 'Pagkatapos ng 1609'
    title:
      en: 'A stone fort the size of a football field'
      fil: 'Isang batong kuta na kasinlaki ng football field'
    body:
      en: >-
        Following Legazpi's final conquest, missionaries were sent out with
        platoons of guardia civil. Father Juan de la Vega, assigned to Tandag,
        raised a stone fort and a walled settlement about the size of a football
        field. The town grew out of that enclosure.

  - period:
      en: '1650'
      fil: '1650'
    title:
      en: 'Capital of the whole Caraga district'
      fil: 'Kabisera ng buong distrito ng Caraga'
    milestone: true
    body:
      en: >-
        Tandag becomes the capital of Caraga — a district covering what are now
        Agusan del Norte and del Sur, both Surigao provinces, and part of Davao.
        It was a port-of-call for the Spanish galleons working the southern
        Mindanao run, and one is still believed to lie on the seabed off the
        Linungao islands.

  - period:
      en: '18th century'
      fil: 'Ika-18 siglo'
    title:
      en: 'Cottas against the sea raids'
      fil: 'Mga cotta laban sa pananalakay mula dagat'
    body:
      en: >-
        Stone cottas go up at the northern edge of town and beside the old
        cemetery to the west. Between 1754 and 1767 Moro raiders wreck the town
        repeatedly; Father Jose Ducos, a Jesuit from Iligan, rebuilds it,
        establishes the Tandag Garrison and restores the priory.

  - period:
      en: '27 April 1944'
      fil: '27 Abril 1944'
    title:
      en: 'The Japanese landing'
      fil: 'Ang paglapag ng mga Hapon'
    body:
      en: >-
        Tandag stayed clear of the occupation for most of the war. Then about 500
        Japanese troops came ashore by boat just outside town and most residents
        fled to the mountains. Guerrillas of the US Army's 10th Military District
        under Capt. Charles Hansen attacked twice and were outnumbered both
        times. The Japanese stayed several weeks and left considerable damage
        behind them.

  - period:
      en: '19 June 1960'
      fil: '19 Hunyo 1960'
    title:
      en: 'Surigao del Sur is created — Tandag is its capital'
      fil: 'Nilikha ang Surigao del Sur — Tandag ang kabisera nito'
    milestone: true
    body:
      en: >-
        Republic Act No. 2786 splits the province off and names Tandag the
        capital and seat of the provincial government, which it has been ever
        since.

  - period:
      en: '2007 – 2011'
      fil: '2007 – 2011'
    title:
      en: 'Cityhood, lost twice, then affirmed'
      fil: 'Pagka-lungsod, dalawang beses nawala, saka pinagtibay'
    milestone: true
    body:
      en: >-
        Republic Act No. 9392 makes Tandag a city in June 2007 — the record gives
        the date as both 23 and 25 June, and Charter Day is kept on the 23rd. The
        Supreme Court then voids the cityhood laws on 18 November 2008, restores
        them on 22 December 2009, voids them again on 23 August 2010, and finally
        affirms them on 15 February 2011.

  - period:
      en: 'September 2018'
      fil: 'Setyembre 2018'
    title:
      en: 'The last scheduled flight'
      fil: 'Ang huling nakatakdang biyahe sa eroplano'
    body:
      en: >-
        Cebgo's Cebu–Tandag service, flown Mondays, Wednesdays and Fridays, is
        terminated. The national secondary airport at Awasian remains, but
        travellers have routed through Butuan, Surigao or Davao ever since.
